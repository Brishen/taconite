[package]
name = "taconite-bundle"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Reads the bundles IRON exporters write for Rust runtimes: manifest.txt records and the tensors.txt/tensors.bin store"
license = "Apache-2.0"
readme = "README.md"
keywords = ["npu", "xdna", "iron", "aie", "amd"]
categories = ["parser-implementations", "science"]

# Deliberately no dependencies (std only, builds offline) and no XRT: a
# bundle is plain data, so tools that only inspect one need not link XRT.
[dependencies]
