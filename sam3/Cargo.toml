[package]
name = "sam3"
version = "0.1.0"
edition = "2024"
description = "SAM3 (Segment Anything 3) text-prompted segmentation on an AMD XDNA NPU: IRON kernels replayed through XRT, no Python"

[features]
default = ["cli", "xrt"]
# The `sam3` binary: decodes images (the `image` crate) and writes overlays.
# The library itself is std-only.
cli = ["dep:image"]
# Run the kernels through XRT (iron-xrt's `xrt` feature: XRT's headers and
# library at build time).
xrt = ["iron-xrt/xrt"]
# Run the kernels through the amdxdna driver's ioctls (`iron_xrt::direct`)
# instead of XRT; it wins when both are on. For a build with no XRT at all:
# `--no-default-features --features cli,direct`.
direct = []

[dependencies]
iron-bundle = { path = "../iron-bundle" }
iron-xrt = { path = "../iron-xrt", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }

[[bin]]
name = "sam3"
required-features = ["cli"]

[profile.release]
debug = 1
