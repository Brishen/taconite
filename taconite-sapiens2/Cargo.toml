[package]
name = "taconite-sapiens2"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "Sapiens2-Pose (308 whole-body keypoints) on an AMD XDNA NPU: IRON kernels replayed through XRT or directly through the amdxdna driver"
license = "Apache-2.0 AND BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/Brishen/taconite"
keywords = ["npu", "xdna", "pose", "keypoints", "amd"]
categories = ["computer-vision", "science", "command-line-utilities"]

[features]
default = ["cli", "xrt"]
# The `sapiens2` binary: decodes images (the `image` crate). The
# library itself takes RGB8 pixels.
cli = ["dep:image"]
# Run the kernels through XRT (taconite's `xrt` feature: XRT's headers and
# library at build time).
xrt = ["taconite/xrt"]
# Run the kernels through the amdxdna driver's ioctls (`taconite::direct`)
# instead of XRT; it wins when both are on. For a build with no XRT at all:
# `--no-default-features --features cli,direct`.
direct = []

[dependencies]
taconite-bundle = { version = "0.1.0", path = "../taconite-bundle" }
taconite = { version = "0.1.1", path = "../taconite", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }

[[bin]]
name = "sapiens2"
required-features = ["cli"]

# docs.rs has no XRT; taconite's build.rs skips the shim there.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[profile.release]
debug = 1
