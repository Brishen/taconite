[package]
name = "taconite-gaic"
version = "0.1.0"
edition = "2024"
description = "GAIC (Grid Anchor based Image Cropping, VGG16) on an AMD XDNA NPU: IRON kernels replayed through XRT, no Python"

[features]
default = ["cli", "xrt"]
# The `gaic` binary: decodes images (the `image` crate) and writes crops.
# The library itself is std-only.
cli = ["dep:image"]
# Run the kernels through XRT (taconite's `xrt` feature: XRT's headers and
# library at build time).
xrt = ["taconite/xrt"]
# Run the kernels through the amdxdna driver's ioctls (`taconite::direct`)
# instead of XRT; it wins when both are on. For a build with no XRT at all:
# `--no-default-features --features cli,direct`.
direct = []

[dependencies]
taconite-bundle = { path = "../taconite-bundle" }
taconite = { path = "../taconite", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }

[[bin]]
name = "gaic"
required-features = ["cli"]

[profile.release]
debug = 1
