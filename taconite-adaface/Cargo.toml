[package]
name = "taconite-adaface"
version = "0.1.0"
edition = "2021"
description = "Embeddable Rust runtime replaying exported AdaFace IR bundles on the NPU via XRT (no Python)"
# `links` lets dependents read DEP_TACONITE_ADAFACE_LIBDIR in their build scripts (the
# rpath link-arg does not propagate across crates; see build.rs).
links = "taconite_adaface"

# No external crates: build.rs compiles the C++ XRT shim with g++, and the
# code uses std plus the in-repo (std-only) bundle reader. Builds offline.

[lib]
name = "taconite_adaface"
path = "src/lib.rs"

[dependencies]
taconite-bundle = { path = "../taconite-bundle" }

[profile.release]
opt-level = 3
