[package]
name = "taconite-adaface"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Embeddable Rust runtime replaying exported AdaFace IR bundles on an AMD XDNA NPU via XRT (no Python)"
license = "Apache-2.0"
readme = "README.md"
keywords = ["npu", "xdna", "adaface", "face-recognition", "amd"]
categories = ["computer-vision", "science"]
# `links` lets dependents read DEP_TACONITE_ADAFACE_LIBDIR in their build scripts (the
# rpath link-arg does not propagate across crates; see build.rs).
links = "taconite_adaface"

# No external crates: build.rs compiles the C++ XRT shim with g++, and the
# code uses std plus the std-only bundle reader. Builds offline.

[lib]
name = "taconite_adaface"
path = "src/lib.rs"

[dependencies]
taconite-bundle = { version = "0.1.0", path = "../taconite-bundle" }

# docs.rs has no XRT; build.rs skips the shim there.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[profile.release]
opt-level = 3
